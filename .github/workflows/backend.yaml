name: Outdoor PM2.5 backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yaml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline behavior checks (no credentials)
        run: python -m unittest discover -s backend/singapore-outdoor-pm25/tests -v
      - name: Fixture preview (no live API calls)
        run: python backend/singapore-outdoor-pm25/tools/preview.py --fixture backend/singapore-outdoor-pm25/tests/fixtures/pm25.json --at 2026-10-12T16:20:00+08:00

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned deployment tooling
        run: python -m pip install -r backend/singapore-outdoor-pm25/requirements-dev.txt
      - name: Verify CLI manifest and upload allowlist (no login or deployment)
        run: python -m unittest discover -s backend/singapore-outdoor-pm25/tests -v
